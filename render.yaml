services:
  - type: web
    name: ff-guild-glory-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: ff-accounts-db
          property: connectionString

databases:
  - name: ff-accounts-db
    plan: free
    databaseName: ff_accounts
